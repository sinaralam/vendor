name: Build vendor.img - Samsung A02

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: "Branch manifest LineageOS"
        required: true
        default: "lineage-20.0"

      device:
        description: "Codename device"
        required: true
        default: "a02"

      lunch_target:
        description: "Lunch combo"
        required: true
        default: "lineage_a02-userdebug"

      build_target:
        description: "Build target"
        required: true
        default: "vendorimage"

      local_manifest_url:
        description: "Raw URL local manifest"
        required: true
        default: "https://raw.githubusercontent.com/rdbckp/vendor/main/.repo/local_manifests/a02.xml"

jobs:
  build-vendor-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      # ============================================================
      # CLEANUP
      # ============================================================
      - name: Cleanup disk
        run: |
          echo "===== DISK BEFORE ====="
          df -h

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/share/swift \
            /opt/az \
            /usr/lib/jvm || true

          sudo docker system prune -af || true
          sudo apt-get clean

          echo "===== DISK AFTER ====="
          df -h

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386

          sudo apt-get update

          sudo apt-get install -y \
            git-core \
            gnupg \
            flex \
            bison \
            build-essential \
            zip \
            unzip \
            curl \
            zlib1g-dev \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            lib32ncurses-dev \
            lib32z1-dev \
            libgl1-mesa-dev \
            libxml2-utils \
            xsltproc \
            fontconfig \
            python3 \
            python-is-python3 \
            rsync

      # ============================================================
      # REPO
      # ============================================================
      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ============================================================
      # GIT CONFIG
      # ============================================================
      - name: Configure git
        run: |
          git config --global user.name "gh-actions"
          git config --global user.email "actions@github.com"
          git config --global color.ui false

      # ============================================================
      # INIT LINEAGE
      # ============================================================
      - name: Initialize LineageOS
        run: |
          mkdir -p "$HOME/lineage20"
          cd "$HOME/lineage20"

          repo init \
            --depth=1 \
            --no-repo-verify \
            -u https://github.com/LineageOS/android.git \
            -b "${{ github.event.inputs.manifest_branch }}" \
            --git-lfs

      # ============================================================
      # LOCAL MANIFEST
      # ============================================================
      - name: Install local manifest
        run: |
          cd "$HOME/lineage20"

          mkdir -p .repo/local_manifests

          curl -fL \
            "${{ github.event.inputs.local_manifest_url }}" \
            -o .repo/local_manifests/a02.xml

          echo
          echo "===== LOCAL MANIFEST ====="
          cat .repo/local_manifests/a02.xml
          echo
          
          echo "===== MANIFEST PROJECTS ====="
          grep -E '<project |<remove-project ' \
            .repo/local_manifests/a02.xml || true

      # ============================================================
      # SYNC
      # ============================================================
      - name: Repo sync
        run: |
          cd "$HOME/lineage20"

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune

          echo
          echo "===== DISK AFTER SYNC ====="
          df -h

      # ============================================================
      # CHECK DEVICE TREE
      # ============================================================
      - name: Check Samsung A02 device tree
        run: |
          cd "$HOME/lineage20"

          DEVICE="${{ github.event.inputs.device }}"
          DEVICE_DIR="device/samsung/$DEVICE"

          echo "===== DEVICE TREE ====="
          echo "$DEVICE_DIR"

          if [ ! -d "$DEVICE_DIR" ]; then
            echo "::error::Device tree tidak ditemukan: $DEVICE_DIR"
            exit 1
          fi

          echo
          echo "===== DEVICE TREE FILES ====="
          find "$DEVICE_DIR" -maxdepth 2 -type f | sort

          echo
          echo "===== PRODUCT FILES ====="

          if [ -f "$DEVICE_DIR/AndroidProducts.mk" ]; then
            echo "--- AndroidProducts.mk ---"
            cat "$DEVICE_DIR/AndroidProducts.mk"
          else
            echo "::error::AndroidProducts.mk tidak ditemukan!"
            exit 1
          fi

          echo

          if [ -f "$DEVICE_DIR/lineage_${DEVICE}.mk" ]; then
            echo "--- lineage_${DEVICE}.mk ---"
            cat "$DEVICE_DIR/lineage_${DEVICE}.mk"
          else
            echo "::error::lineage_${DEVICE}.mk tidak ditemukan!"
            echo
            echo "File yang tersedia:"
            find "$DEVICE_DIR" -maxdepth 1 -type f -name "*.mk" -print
            exit 1
          fi

      # ============================================================
      # CHECK OBSOLETE VENDORSETUP
      # ============================================================
      - name: Check obsolete lunch configuration
        run: |
          cd "$HOME/lineage20"

          DEVICE="${{ github.event.inputs.device }}"
          DEVICE_DIR="device/samsung/$DEVICE"

          if [ -f "$DEVICE_DIR/vendorsetup.sh" ]; then
            echo "::warning::vendorsetup.sh masih ada."

            if grep -n "add_lunch_combo" "$DEVICE_DIR/vendorsetup.sh"; then
              echo "::warning::add_lunch_combo sudah obsolete."
              echo "Gunakan COMMON_LUNCH_CHOICES di AndroidProducts.mk."
            fi
          fi

      # ============================================================
      # ENVSETUP
      # ============================================================
      - name: Setup Android build environment
        run: |
          cd "$HOME/lineage20"

          source build/envsetup.sh

          echo
          echo "===== AVAILABLE LUNCH TARGETS ====="
          lunch 2>&1 | tee /tmp/lunch_menu.txt || true

      # ============================================================
      # VALIDATE LUNCH
      # ============================================================
      - name: Validate lunch target
        run: |
          cd "$HOME/lineage20"

          source build/envsetup.sh

          TARGET="${{ github.event.inputs.lunch_target }}"

          echo "Testing lunch target:"
          echo "$TARGET"

          if ! lunch "$TARGET"; then
            echo
            echo "=============================================="
            echo "LUNCH TARGET GAGAL"
            echo "=============================================="
            echo
            echo "Target:"
            echo "$TARGET"
            echo
            echo "Kemungkinan penyebab:"
            echo "1. AndroidProducts.mk salah."
            echo "2. lineage_a02.mk tidak ada."
            echo "3. lineage_a02.mk tidak direferensikan."
            echo "4. Device tree tidak cocok dengan LineageOS 20."
            echo "5. Local manifest memakai repository/branch yang salah."
            echo
            exit 1
          fi

          echo
          echo "===== LUNCH SUCCESS ====="
          echo "TARGET=$TARGET"

      # ============================================================
      # BUILD VENDOR
      # ============================================================
      - name: Build vendor image
        run: |
          cd "$HOME/lineage20"

          source build/envsetup.sh

          lunch "${{ github.event.inputs.lunch_target }}"

          echo
          echo "===== BUILD START ====="
          echo "Target: ${{ github.event.inputs.build_target }}"
          echo

          make \
            "${{ github.event.inputs.build_target }}" \
            -j2

      # ============================================================
      # FIND OUTPUT
      # ============================================================
      - name: Find build output
        run: |
          cd "$HOME/lineage20"

          DEVICE="${{ github.event.inputs.device }}"
          OUT="out/target/product/$DEVICE"

          echo "===== OUTPUT DIRECTORY ====="

          if [ -d "$OUT" ]; then
            ls -lah "$OUT"
          else
            echo "::error::Output directory tidak ditemukan: $OUT"
            exit 1
          fi

          echo
          echo "===== BUILD ARTIFACTS ====="

          find "$OUT" -maxdepth 1 -type f \
            \( \
              -name "vendor.img" \
              -o -name "*.zip" \
              -o -name "*.img" \
            \) \
            -print | tee /tmp/found_files.txt

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload vendor image
        uses: actions/upload-artifact@v4
        with:
          name: vendor-build-${{ github.event.inputs.device }}
          path: |
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/vendor.img
            /home/runner/lineage20/out/target/product/${{ github.event.inputs.device }}/*.zip
          if-no-files-found: warn
          retention-days: 7
